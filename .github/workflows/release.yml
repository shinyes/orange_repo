name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  docker-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image names
        id: vars
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "judge_image=ghcr.io/${GITHUB_REPOSITORY,,}-judge" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------- 主镜像（orangerepo + quiz 双二进制，distroless） ----------
      - name: Extract main image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push main image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release

      # ---------- 判题沙箱镜像（ubuntu + nsjail + g++ + python3） ----------
      - name: Extract judge image metadata
        id: meta-judge
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.judge_image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push judge image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.judge
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta-judge.outputs.tags }}
          labels: ${{ steps.meta-judge.outputs.labels }}
          cache-from: type=gha,scope=release-judge
          cache-to: type=gha,mode=max,scope=release-judge

      # ---------- Release 附件：主镜像离线包 ----------
      - name: Export main image tarball
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ASSET="orangerepo-${VERSION}-linux-amd64-image.tar.gz"
          docker pull "${IMAGE}:${VERSION}"
          docker image save "${IMAGE}:${VERSION}" -o orangerepo-image.tar
          gzip -9 orangerepo-image.tar
          mv orangerepo-image.tar.gz "${ASSET}"
          echo "ASSET=${ASSET}" >> "$GITHUB_ENV"

      # ---------- Release 附件：判题沙箱离线包 ----------
      - name: Export judge image tarball
        env:
          JUDGE_IMAGE: ${{ steps.vars.outputs.judge_image }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          JUDGE_ASSET="orangerepo-${VERSION}-judge-linux-amd64-image.tar.gz"
          docker pull "${JUDGE_IMAGE}:${VERSION}"
          docker image save "${JUDGE_IMAGE}:${VERSION}" -o judge-image.tar
          gzip -9 judge-image.tar
          mv judge-image.tar.gz "${JUDGE_ASSET}"
          echo "JUDGE_ASSET=${JUDGE_ASSET}" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ env.ASSET }}
            ${{ env.JUDGE_ASSET }}
          body: |
            ## Docker 镜像

            主站 + 刷题服务：

            ```bash
            docker pull ${{ steps.vars.outputs.image }}:${{ github.ref_name }}
            ```

            判题沙箱（judge-runtime，nsjail 隔离）：

            ```bash
            docker pull ${{ steps.vars.outputs.judge_image }}:${{ github.ref_name }}
            ```

            ## 离线安装

            下载附件中的镜像包，在无外网（或无法访问 GHCR）的机器上导入：

            ```bash
            docker load -i orangerepo-*-linux-amd64-image.tar.gz        # 主站 + 刷题服务
            docker load -i orangerepo-*-judge-linux-amd64-image.tar.gz  # 判题沙箱
            ```

            首次启动默认密码 `123456`，请登录后修改。数据持久化目录：容器内 `/app/data`。
