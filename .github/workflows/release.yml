name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  docker-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute image names
        id: vars
        shell: bash
        run: |
          echo "image=ghcr.io/shinyes/orangeoj" >> "$GITHUB_OUTPUT"
          echo "judge_image=ghcr.io/shinyes/orangeoj-judge" >> "$GITHUB_OUTPUT"
          echo "scratch_image=ghcr.io/shinyes/orangeoj-scratch" >> "$GITHUB_OUTPUT"

      # judge 镜像仅在其相关文件自上一 tag 有变更时才重建（nsjail 编译耗时；
      # compose 默认引用 judge:latest，未变更时沿用既有镜像）。
      - name: Detect judge changes since last tag
        id: judge
        shell: bash
        run: |
          LAST="$(git describe --abbrev=0 --tags "${{ github.ref_name }}^" 2>/dev/null || true)"
          if [ -z "$LAST" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"   # 首个 tag：构建
            echo "reason=first release tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED="$(git diff --name-only "$LAST..${{ github.ref_name }}" -- \
            Dockerfile.judge cmd/judge-runtime internal/judge internal/judgeserver go.mod go.sum | head -1)"
          if [ -n "$CHANGED" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "reason=$CHANGED" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "reason=no judge-related changes since $LAST" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------- 主镜像（orangeoj 单二进制：管理 + 门户 API 合服，distroless） ----------
      - name: Extract main image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push main image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release

      # ---------- 判题沙箱镜像（ubuntu + nsjail + g++ + python3；仅 judge 相关变更时构建） ----------
      - name: Extract judge image metadata
        id: meta-judge
        if: steps.judge.outputs.changed == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.judge_image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push judge image
        if: steps.judge.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.judge
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta-judge.outputs.tags }}
          labels: ${{ steps.meta-judge.outputs.labels }}
          cache-from: type=gha,scope=release-judge
          cache-to: type=gha,mode=max,scope=release-judge

      # ---------- Scratch 编辑器镜像（独立容器，AGPL 组件；素材库在构建期抓取） ----------
      # 素材库镜像需要构建机能访问 https://assets.scratch.mit.edu（共约 1347 个资源）。
      # 这里用 ASSET_MIRROR_REQUIRED=1 让"素材不全"直接构建失败——避免产出素材为空的镜像
      # （曾经出现过：镜像压缩包只有 71MB，说明素材根本没进去，却"构建成功"了）。
      # 若构建机确实访问不到该域名：先在能联网的机器上跑
      #   go run ./cmd/scratchassets -out ./scratch-assets
      # 把结果放进仓库的 scratch-assets/ 目录（或提交），再构建即可离线产出完整镜像。
      - name: Extract scratch image metadata
        id: meta-scratch
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.scratch_image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push scratch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./scratch/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            ASSET_MIRROR_REQUIRED=1
          tags: ${{ steps.meta-scratch.outputs.tags }}
          labels: ${{ steps.meta-scratch.outputs.labels }}
          cache-from: type=gha,scope=release-scratch
          cache-to: type=gha,mode=max,scope=release-scratch

      # ---------- Release 附件：主镜像离线包 ----------
      - name: Export main image tarball
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ASSET="orangeoj-${VERSION}-linux-amd64-image.tar.gz"
          docker pull "${IMAGE}:${VERSION}"
          docker image save "${IMAGE}:${VERSION}" -o orangeoj-image.tar
          gzip -9 orangeoj-image.tar
          mv orangeoj-image.tar.gz "${ASSET}"
          echo "ASSET=${ASSET}" >> "$GITHUB_ENV"

      # ---------- Release 附件：判题沙箱离线包（仅 judge 变更时构建） ----------
      - name: Export judge image tarball
        if: steps.judge.outputs.changed == 'true'
        env:
          JUDGE_IMAGE: ${{ steps.vars.outputs.judge_image }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          JUDGE_ASSET="orangeoj-${VERSION}-judge-linux-amd64-image.tar.gz"
          docker pull "${JUDGE_IMAGE}:${VERSION}"
          docker image save "${JUDGE_IMAGE}:${VERSION}" -o judge-image.tar
          gzip -9 judge-image.tar
          mv judge-image.tar.gz "${JUDGE_ASSET}"
          echo "JUDGE_ASSET=${JUDGE_ASSET}" >> "$GITHUB_ENV"

      # ---------- Release 附件：Scratch 编辑器离线包（独立容器，AGPL 组件） ----------
      # 注：该镜像含完整素材库，压缩包通常数百 MB，导出/上传会占一些 CI 时间。
      - name: Export scratch image tarball
        env:
          SCRATCH_IMAGE: ${{ steps.vars.outputs.scratch_image }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SCRATCH_ASSET="orangeoj-${VERSION}-scratch-linux-amd64-image.tar.gz"
          docker pull "${SCRATCH_IMAGE}:${VERSION}"
          docker image save "${SCRATCH_IMAGE}:${VERSION}" -o scratch-image.tar
          gzip -9 scratch-image.tar
          mv scratch-image.tar.gz "${SCRATCH_ASSET}"
          echo "SCRATCH_ASSET=${SCRATCH_ASSET}" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ env.ASSET }}
            ${{ env.JUDGE_ASSET }}
            ${{ env.SCRATCH_ASSET }}
          body: |
            ## Docker 镜像

            主站 + 刷题服务：

            ```bash
            docker pull ${{ steps.vars.outputs.image }}:${{ github.ref_name }}
            ```

            判题沙箱（judge-runtime，nsjail 隔离）——**仅当本版本包含 judge 相关变更时构建**：
            若未随本版发布，则沿用 `ghcr.io/shinyes/orangeoj-judge:latest`（compose 默认引用 latest）：

            ```bash
            docker pull ${{ steps.vars.outputs.judge_image }}:latest
            ```

            Scratch 编辑器（AGPL-3.0，独立容器；无需 Scratch 可不部署）：

            ```bash
            docker pull ${{ steps.vars.outputs.scratch_image }}:${{ github.ref_name }}
            ```

            以**内部容器**方式运行（推荐）：Scratch 服务不对外暴露端口，主站反代 `/scratch-app/`：

            ```yaml
            # docker-compose.yml
            orangeoj:
              environment:
                ORANGEOJ_SCRATCH_INTERNAL_URL: "http://orangescratch:80"
            orangescratch:
              image: ${{ steps.vars.outputs.scratch_image }}:${{ github.ref_name }}
              expose: ["80"]        # 注意：不写 ports，仅在 compose 网络内可达
            ```

            也支持子域直连：给主站配 `ORANGEOJ_SCRATCH_URL=https://scratch.example.com`，
            并给该服务加 `ports: ["8081:80"]` 后用反向代理绑到子域。两者都不配 = 未部署（页面显示提示）。

            ## 离线安装

            下载附件中的镜像包，在无外网（或无法访问 GHCR）的机器上导入：

            ```bash
            docker load -i orangeoj-*-linux-amd64-image.tar.gz          # 主站 + 刷题服务
            docker load -i orangeoj-*-judge-linux-amd64-image.tar.gz    # 判题沙箱（有则存在）
            docker load -i orangeoj-*-scratch-linux-amd64-image.tar.gz  # Scratch 编辑器（可选）
            ```

            首次启动默认密码 `123456`，请登录后修改。数据持久化目录：容器内 `/app/data`。
