# OrangeOJ 生产部署示例（主服务 + 判题沙箱 + 可选 Scratch 编辑器 三容器）
# docker compose -f deploy/docker-compose.yml up -d
#   → http://localhost:8080（单服务：学生门户 / + 管理端 /admin，默认 admin/123456）
#   → orangejudge :9090（判题沙箱，不对外）
#   → orangescratch :8081（Scratch 编辑器静态服务；主站以 iframe 嵌入）
#
# orangeoj 主服务 = 单 Go 进程托管单前端（app dist：门户 / + 管理区 /admin 走前端路由）
# 与全部 API（/api/*），数据在 ./data/orangeoj.db（单库）。
# orangejudge 是真正执行学生代码的容器（nsjail 隔离），需要 privileged + cgroup v2 挂载；
# 镜像由 GitHub Actions 发布：judge 相关文件变更的版本构建 ghcr.io/shinyes/orangeoj-judge:<版本>
# 并刷新 :latest，其余版本沿用 latest（可用 ORANGEOJ_JUDGE_IMAGE 覆盖）。
#
# Scratch 编辑器（AGPL-3.0，独立容器，**内部容器模式**，可选）：
#   · 用途：Scratch 空间里的「Scratch」创作页（离线可用，素材库打在镜像里）
#   · 不对外暴露端口：主站按 Host 在**子域根路径**反代到本服务（无需为它单独配证书）
#   · 主站侧配置：ORANGEOJ_SCRATCH_URL=https://scratch.example.com + ORANGEOJ_SCRATCH_INTERNAL_URL=http://orangescratch:80
#   · 若要走独立子域直连（不经主站反代）：只配 ORANGEOJ_SCRATCH_URL，并给本服务加 ports: ["8081:80"]
#   · 两者都留空 = 未部署：Scratch 空间页显示「未部署」提示，其余功能不受影响
#   · 不需要 Scratch 的部署：删掉本服务与主站的 Scratch 配置即可
services:
  orangeoj:
    image: ghcr.io/shinyes/orangeoj:latest
    container_name: orangeoj
    entrypoint: ["/app/orangeoj"]
    command: [
      "-addr", ":8080",
      "-data", "/app/data",
      "-web", "/app/dist",
      "-judge-endpoint", "http://orangejudge:9090",
      "-judge-token", "${ORANGEOJ_JUDGE_SHARED_TOKEN:-change-this-in-production}",
      "-judge-workers", "2",
    ]
    environment:
      # Scratch 编辑器容器（内部容器，不对外暴露端口）。两种用法，按需选一个：
      #
      # 【默认·最省事】只配 ORANGEOJ_SCRATCH_INTERNAL_URL（下面已给默认值）：
      #   主站在**同源路径** /scratch-app/ 反代容器 —— 不需要子域、DNS、证书，也不需要动反向代理。
      #   前提：Scratch 镜像里的编辑器产物已做 publicPath 运行期注入（v2.7.13 起默认已做）。
      #
      # 【可选】再配 ORANGEOJ_SCRATCH_URL（公开子域，如 https://scratch.example.com）：
      #   主站改为按 Host 在**子域根路径**反代（不带路径前缀）。需要在 DNS 加子域记录，并在反向代理
      #   里把该子域指向**主服务的同一个端口**（即下面 ports 映射的 8080），例如 Nginx：
      #     server_name scratch.example.com;  location / { proxy_pass http://127.0.0.1:8080; }
      #   （只配 ORANGEOJ_SCRATCH_URL、不配内部地址 = 子域直连容器，自行暴露端口与证书）
      #
      # 两者都不配 = 未部署（Scratch 空间页显示提示，其余功能不受影响；服务照常启动）。
      ORANGEOJ_SCRATCH_URL: "${ORANGEOJ_SCRATCH_URL:-}"
      ORANGEOJ_SCRATCH_INTERNAL_URL: "http://orangescratch:80"
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    depends_on:
      orangejudge:
        condition: service_healthy
    restart: unless-stopped

  # 判题沙箱：真正执行 Python/C++ 代码；nsjail 需要特权与宿主机 cgroup v2。
  orangejudge:
    image: ${ORANGEOJ_JUDGE_IMAGE:-ghcr.io/shinyes/orangeoj-judge:latest}
    container_name: orangejudge
    restart: unless-stopped
    privileged: true
    cgroup: host
    environment:
      ORANGEOJ_JUDGE_RUNTIME_PORT: "9090"
      ORANGEOJ_JUDGE_WORKDIR: "/work/jobs"
      ORANGEOJ_JUDGE_COMPILE_TIMEOUT_SEC: "10"
      ORANGEOJ_JUDGE_SHARED_TOKEN: "${ORANGEOJ_JUDGE_SHARED_TOKEN:-change-this-in-production}"
    cap_add:
      - SYS_ADMIN
      - SYS_RESOURCE
      - SYS_PTRACE
    security_opt:
      - apparmor=unconfined
      - seccomp=unconfined
    volumes:
      - judge-work:/work/jobs
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9090/healthz >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Scratch 编辑器（AGPL-3.0，**内部容器**：不映射端口，仅主站反代访问；可选服务）
  #   · 镜像内置完整素材库（角色/造型/声音/背景），离线可用
  #   · 主站按 Host 在子域根路径反代本服务（见上方 orangeoj 的 Scratch 配置说明）
  #   · 启动后自检：curl -fsS http://127.0.0.1/healthz（容器内）
  #   · 不需要 Scratch 时：删掉本服务与主站的 ORANGEOJ_SCRATCH_INTERNAL_URL 即可
  orangescratch:
    image: ${ORANGEOJ_SCRATCH_IMAGE:-ghcr.io/shinyes/orangeoj-scratch:latest}
    container_name: orangescratch
    restart: unless-stopped
    # 注意：**不写 ports** —— 只在 compose 网络内可达，由主站反代对外提供
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  judge-work:
