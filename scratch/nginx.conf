# OrangeOJ Scratch 容器：纯静态服务（编辑器产物 + 积木素材 + 本地素材库镜像）
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 素材/产物按内容哈希命名，可长期缓存
    location ~* \.(js|mjs|png|svg|jpg|jpeg|gif|webp|wav|mp3|ogg|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 允许被主站跨源 iframe 嵌入（主站与本站同站部署；如需收紧可改为具体域名）
    add_header X-Frame-Options "";
    add_header Content-Security-Policy "frame-ancestors *";

    location /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}