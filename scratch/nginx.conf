# OrangeOJ Scratch 容器：静态服务（编辑器产物 + 积木素材 + 本地素材库）
#
# 本文件有两个关键点：
#   1) gzip：主包 scratch-gui-standalone.js 16.37MB → 5.46MB（实测 33%），chunks 0.99→0.34MB，
#      SVG 素材同样受益（WAV/PNG 本身已压缩，不重复压）
#   2) 缓存分两类（旧配置把所有 .js 都设成 immutable，导致固定文件名的主包/host.js 在浏览器里
#      一年不更新——升级镜像后用户仍跑旧版；这里按"是否带内容哈希"区分）：
#      · 带哈希的（/chunks/*、/static/*）→ 一年强缓存 immutable
#      · 固定文件名的（主包 / host.js / extension-worker.js / 入口 HTML）→ no-cache + ETag 校验，
#        未变化时是 304，代价极小，但保证升级立即生效
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        application/wasm;

    # 带内容哈希名的资源：内容一变就换名，可长期强缓存
    location ~* ^/(chunks|static)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 固定文件名：每次校验（多为 304），保证升级后立即生效
    location = /scratch-gui-standalone.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /extension-worker.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /host.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        # 允许被主站的 iframe 嵌入（主站与本站同站部署；如需收紧改为具体来源）
        add_header Content-Security-Policy "frame-ancestors *";
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
